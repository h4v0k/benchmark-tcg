name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check src/lib
        run: TSC="npx -y -p typescript@6.0.3 tsc" bash tests/typecheck-lib.sh

  # Full type check (React types installed here), build, unit tests and the browser tests against the built site.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check everything
        run: npx tsc --noEmit
      - name: Build
        run: node build.mjs
      - name: Unit tests
        run: node tests/unit.mjs
      - name: Install the test browser
        run: npm install --no-save --no-audit --no-fund playwright@1 && npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/e2e.mjs
